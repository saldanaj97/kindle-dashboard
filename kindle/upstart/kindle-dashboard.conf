# Kindle dashboard kiosk. Install as /etc/upstart/kindle-dashboard.conf (the
# root filesystem is read-only: mount -o remount,rw / first, then remount ro).
# Runs only while /mnt/us/KINDLE_DASHBOARD_KIOSK exists (checked in kiosk.sh).
description "Kindle dashboard kiosk"

# lab126_gui starts late in boot, once the system is up; kiosk.sh then stops it.
start on started lab126_gui
stop on stopping dbus

respawn
respawn limit 5 300
# kiosk.sh exits 0 when it leaves the interface alone; don't respawn that.
normal exit 0

exec /bin/sh /var/local/dashboard/kiosk.sh
